services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: helio
      POSTGRES_PASSWORD: helio
      POSTGRES_DB: helio
    port:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helio -d helio"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - helio_pg:/var/lib/postgresql/data
volumes:
  helio_pg: {}
