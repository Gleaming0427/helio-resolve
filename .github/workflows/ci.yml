name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Tenant isolation, refunds and document indexing are only proven against a real
    # PostgreSQL: the integration suite runs on every change, not just locally.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: helio
          POSTGRES_PASSWORD: helio
          POSTGRES_DB: helio_refund_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helio -d helio_refund_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://helio:helio@localhost:5432/helio_refund_test
      HELIO_TEST_DATABASE_URL: postgresql://helio:helio@localhost:5432/helio_refund_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:deploy
      - run: npm run test:integration
